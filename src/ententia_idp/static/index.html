<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ententia IDP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>(function(){var t=localStorage.getItem('idp-theme')||'dark';document.documentElement.setAttribute('data-theme',t);})();</script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <style>
    :root {
      --bg:          #060d18;
      --surface:     #0a1522;
      --panel:       #0c1a2a;
      --panel-alt:   #0f1e30;
      --border:      #152840;
      --border-hi:   #1c3656;
      --text:        #c2d6ee;
      --sub:         #4a6a86;
      --sub2:        #28404e;
      --blue:        #3b9eff;
      --blue-dim:    #091f3a;
      --teal:        #2dd4a0;
      --teal-dim:    #052818;
      --amber:       #f5a623;
      --amber-dim:   #291900;
      --red:         #f05454;
      --red-dim:     #250c0c;
      --violet:      #a78bfa;
      --violet-dim:  #1a1240;
      --green:       #22c55e;
      --grid:        rgba(59,158,255,0.028);
      --topbar-bg:   rgba(6,13,24,0.92);
      --nav-hover:   rgba(255,255,255,0.05);
    }

    html[data-theme="light"] {
      --bg:          #f0f5fb;
      --surface:     #ffffff;
      --panel:       #f5f9ff;
      --panel-alt:   #eaf0fa;
      --border:      #cdd9ec;
      --border-hi:   #a4bcd8;
      --text:        #0d1e38;
      --sub:         #5a7a9c;
      --sub2:        #94aec8;
      --blue:        #1760c0;
      --blue-dim:    #ddeeff;
      --teal:        #0a7858;
      --teal-dim:    #ccf0e4;
      --amber:       #b86800;
      --amber-dim:   #fff0cc;
      --red:         #c02020;
      --red-dim:     #ffe0e0;
      --violet:      #5824b8;
      --violet-dim:  #ece0ff;
      --green:       #1a9048;
      --grid:        rgba(23,96,192,0.04);
      --topbar-bg:   rgba(240,245,251,0.95);
      --nav-hover:   rgba(0,0,0,0.05);
    }

    *,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { height: 100%; scroll-behavior: smooth; }

    body {
      min-height: 100%;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      background-image:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px);
      background-size: 24px 24px;
      color: var(--text);
      font-size: 13.5px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Topbar ───────────────────────────────────── */
    .topbar {
      position: fixed; top: 0; left: 0; right: 0;
      height: 52px; z-index: 200;
      background: var(--topbar-bg);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center;
      padding: 0 24px; gap: 0;
    }
    .brand {
      display: flex; align-items: center; gap: 9px;
      margin-right: 28px; flex-shrink: 0;
    }
    .brand-logo {
      width: 28px; height: 28px;
      background: linear-gradient(135deg, #3b9eff 0%, #1260cc 100%);
      border-radius: 7px;
      display: flex; align-items: center; justify-content: center;
    }
    .brand-logo svg { width: 15px; height: 15px; }
    .brand-name { font-size: 14px; font-weight: 700; color: var(--text); letter-spacing: -0.02em; }
    .brand-tag {
      font-size: 9.5px; font-weight: 700; letter-spacing: 0.12em;
      text-transform: uppercase; padding: 2px 6px; border-radius: 3px;
      background: var(--blue-dim); color: var(--blue);
      border: 1px solid rgba(59,158,255,0.2);
    }
    .nav-tabs { display: flex; gap: 2px; flex: 1; }
    .nav-tab {
      padding: 6px 14px; border: none; background: transparent;
      color: var(--sub); font-family: inherit; font-size: 13px;
      font-weight: 500; cursor: pointer; border-radius: 6px;
      transition: color 0.1s, background 0.1s;
    }
    .nav-tab:hover { background: var(--nav-hover); color: var(--text); }
    .nav-tab.active { background: rgba(59,158,255,0.1); color: var(--blue); }
    .health-badge {
      margin-left: auto; display: flex; align-items: center;
      gap: 7px; font-size: 11.5px; color: var(--sub); flex-shrink: 0;
    }
    .health-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 0 2px rgba(34,197,94,0.22);
      animation: pulse 2.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%,100% { box-shadow: 0 0 0 2px rgba(34,197,94,0.22); }
      50%      { box-shadow: 0 0 0 5px rgba(34,197,94,0.08); }
    }
    .theme-toggle {
      width: 32px; height: 32px; flex-shrink: 0;
      border: 1px solid var(--border); border-radius: 7px;
      background: transparent; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      color: var(--sub); margin-left: 12px;
      transition: background 0.12s, border-color 0.12s, color 0.12s;
    }
    .theme-toggle:hover { background: var(--panel); border-color: var(--border-hi); color: var(--text); }

    /* ── Layout ───────────────────────────────────── */
    .main { padding-top: 52px; }
    .container { max-width: 1080px; margin: 0 auto; padding: 32px 24px 72px; }

    /* ── Upload card ──────────────────────────────── */
    .upload-card {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 12px; padding: 20px; margin-bottom: 20px;
    }
    .card-title {
      font-size: 10.5px; font-weight: 600; letter-spacing: 0.16em;
      text-transform: uppercase; color: var(--sub); margin-bottom: 14px;
    }
    .upload-zone {
      border: 1.5px dashed var(--border-hi); border-radius: 10px;
      padding: 36px 20px; display: flex; flex-direction: column;
      align-items: center; gap: 11px; cursor: pointer;
      transition: border-color 0.15s, background 0.15s; text-align: center;
    }
    .upload-zone:hover, .upload-zone.dragging {
      border-color: var(--blue); background: rgba(59,158,255,0.05);
    }
    .upload-zone.has-file {
      border-style: solid; border-color: rgba(59,158,255,0.3);
      background: rgba(59,158,255,0.03); padding: 22px 20px; cursor: default;
    }
    .upload-icon {
      width: 42px; height: 42px; border-radius: 11px;
      background: var(--blue-dim); display: flex; align-items: center; justify-content: center;
    }
    .upload-title { font-size: 14px; font-weight: 600; color: var(--text); }
    .upload-sub   { font-size: 12px; color: var(--sub); }
    .file-ext {
      display: inline-flex; align-items: center; border-radius: 5px;
      padding: 3px 8px; font-size: 10.5px; font-weight: 700;
      letter-spacing: 0.1em; text-transform: uppercase;
      background: var(--blue-dim); color: var(--blue);
      border: 1px solid rgba(59,158,255,0.22); font-family: ui-monospace, monospace;
    }
    .file-name {
      font-size: 14px; font-weight: 600; color: var(--text);
      max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .file-size { font-size: 11.5px; color: var(--sub); }
    .hidden-input { display: none; }

    /* ── Buttons ──────────────────────────────────── */
    .btn-row { display: flex; gap: 10px; align-items: center; margin-top: 16px; flex-wrap: wrap; }
    .btn {
      display: inline-flex; align-items: center; gap: 7px;
      border: none; border-radius: 8px; padding: 9px 18px;
      font-family: inherit; font-size: 13.5px; font-weight: 600;
      cursor: pointer; transition: opacity 0.12s, transform 0.08s;
    }
    .btn:active:not(:disabled) { transform: scale(0.97); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-primary { background: var(--blue); color: #fff; }
    .btn-primary:hover:not(:disabled) { background: #5aaaff; }
    .btn-ghost {
      background: rgba(255,255,255,0.05); color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover:not(:disabled) { background: rgba(255,255,255,0.08); border-color: var(--border-hi); }
    .spinner {
      width: 14px; height: 14px; flex-shrink: 0;
      border: 2px solid rgba(255,255,255,0.25);
      border-top-color: white; border-radius: 50%;
      animation: spin 0.65s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Alerts ───────────────────────────────────── */
    .alert {
      display: flex; align-items: flex-start; gap: 10px;
      border-radius: 8px; padding: 10px 14px; font-size: 13px; margin-top: 12px;
    }
    .alert-error { background: var(--red-dim); color: #fca5a5; border: 1px solid rgba(240,84,84,0.22); }
    .alert-warn  { background: var(--amber-dim); color: #fcd34d; border: 1px solid rgba(245,166,35,0.22); }

    /* ── Stat grid ────────────────────────────────── */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(195px, 1fr));
      gap: 12px; margin-bottom: 20px;
    }
    .stat-card {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 10px; padding: 14px 16px;
      position: relative; overflow: hidden;
    }
    .stat-card::before {
      content: ''; position: absolute; top: 0; left: 0;
      width: 3px; height: 100%; border-radius: 3px 0 0 3px;
    }
    .stat-card.c-blue::before   { background: var(--blue); }
    .stat-card.c-teal::before   { background: var(--teal); }
    .stat-card.c-amber::before  { background: var(--amber); }
    .stat-card.c-violet::before { background: var(--violet); }
    .stat-card.c-red::before    { background: var(--red); }
    .stat-label {
      font-size: 10.5px; font-weight: 500; letter-spacing: 0.07em;
      text-transform: uppercase; color: var(--sub); margin-bottom: 6px;
    }
    .stat-value {
      font-size: 19px; font-weight: 700; color: var(--text);
      line-height: 1.2; font-variant-numeric: tabular-nums; word-break: break-all;
    }
    .stat-value.mono {
      font-family: ui-monospace, 'SFMono-Regular', monospace;
      font-size: 11.5px; font-weight: 500; color: var(--sub);
    }

    /* ── Classification pill ──────────────────────── */
    .classif-pill {
      display: inline-flex; align-items: center; gap: 6px;
      border-radius: 6px; padding: 4px 11px; font-size: 13px; font-weight: 600;
    }
    .c-sow     { background: var(--blue-dim);   color: var(--blue);   border: 1px solid rgba(59,158,255,0.25); }
    .c-invoice { background: var(--amber-dim);  color: var(--amber);  border: 1px solid rgba(245,166,35,0.25); }
    .c-support { background: var(--red-dim);    color: var(--red);    border: 1px solid rgba(240,84,84,0.25); }
    .c-vendor  { background: var(--violet-dim); color: var(--violet); border: 1px solid rgba(167,139,250,0.25); }
    .c-unknown { background: rgba(255,255,255,0.04); color: var(--sub); border: 1px solid var(--border); }

    /* ── Result sections ──────────────────────────── */
    .result-block {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 12px; margin-bottom: 14px; overflow: hidden;
    }
    .result-block-header {
      padding: 11px 16px; background: rgba(255,255,255,0.025);
      border-bottom: 1px solid var(--border);
      font-size: 10.5px; font-weight: 600; letter-spacing: 0.14em;
      text-transform: uppercase; color: var(--sub);
      display: flex; align-items: center; gap: 8px;
    }
    .result-block-body { padding: 16px; }

    /* ── Tags ─────────────────────────────────────── */
    .tags-wrap { display: flex; flex-wrap: wrap; gap: 7px; }
    .tag-pill {
      background: var(--teal-dim); color: var(--teal);
      border: 1px solid rgba(45,212,160,0.2); border-radius: 4px;
      padding: 3px 10px; font-size: 12px; font-weight: 600;
      font-family: ui-monospace, monospace; letter-spacing: 0.02em;
    }

    /* ── Summary ──────────────────────────────────── */
    .summary-text { font-size: 14px; line-height: 1.8; color: var(--text); }

    /* ── Tables ───────────────────────────────────── */
    .table-wrap { overflow-x: auto; border-radius: 8px; border: 1px solid var(--border); }
    .data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .data-table thead tr { background: rgba(255,255,255,0.025); }
    .data-table th {
      padding: 10px 14px; text-align: left; font-size: 10.5px;
      font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--sub); border-bottom: 1px solid var(--border); white-space: nowrap;
    }
    .data-table td {
      padding: 10px 14px; border-bottom: 1px solid rgba(21,40,64,0.55);
      color: var(--text); vertical-align: top;
      font-variant-numeric: tabular-nums;
    }
    .data-table tr:last-child td { border-bottom: none; }
    .data-table tbody tr:hover td { background: rgba(255,255,255,0.018); }
    .data-table td.num { font-family: ui-monospace, monospace; font-size: 12.5px; }
    .status-dot {
      width: 6px; height: 6px; border-radius: 50%;
      display: inline-block; margin-right: 6px; vertical-align: middle;
    }
    .dot-ok  { background: var(--teal); }
    .dot-err { background: var(--red); }

    /* ── KV nested table ──────────────────────────── */
    .kv-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    .kv-table tr { border-bottom: 1px solid rgba(21,40,64,0.5); }
    .kv-table tr:last-child { border-bottom: none; }
    .kv-table th {
      padding: 7px 10px; text-align: left; font-size: 11px;
      font-weight: 500; color: var(--sub); white-space: nowrap;
      vertical-align: top; width: 180px;
      background: rgba(255,255,255,0.02); text-transform: capitalize;
    }
    .kv-table td { padding: 7px 10px; color: var(--text); vertical-align: top; }

    /* ── Graph container ──────────────────────────── */
    .graph-card {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 12px; margin-bottom: 20px; overflow: hidden;
    }
    .graph-card-header {
      padding: 11px 16px; background: rgba(255,255,255,0.025);
      border-bottom: 1px solid var(--border);
      font-size: 10.5px; font-weight: 600; letter-spacing: 0.14em;
      text-transform: uppercase; color: var(--sub);
      display: flex; align-items: center; justify-content: space-between;
    }
    .graph-card-body { padding: 16px; overflow-x: auto; min-height: 60px; display: flex; justify-content: center; }
    .graph-card-body svg { background: transparent !important; }
    #graphInner { display: flex; justify-content: center; width: 100%; }
    #graphInner svg { max-width: 100%; height: auto; }

    /* ── Mermaid graph overrides ──────────────────── */
    #graphInner svg { background: transparent !important; }
    #graphInner .label foreignObject { overflow: visible; }

    /* dark */
    html[data-theme="dark"] #graphInner .node rect,
    html[data-theme="dark"] #graphInner .node circle,
    html[data-theme="dark"] #graphInner .node ellipse,
    html[data-theme="dark"] #graphInner .node polygon {
      fill: #0c1824 !important; stroke: #1e3a58 !important; stroke-width: 1.5px !important;
    }
    html[data-theme="dark"] #graphInner .node text,
    html[data-theme="dark"] #graphInner .nodeLabel,
    html[data-theme="dark"] #graphInner foreignObject div,
    html[data-theme="dark"] #graphInner foreignObject span {
      fill: #c2d6ee !important; color: #c2d6ee !important;
    }
    html[data-theme="dark"] #graphInner .flowchart-link,
    html[data-theme="dark"] #graphInner .path,
    html[data-theme="dark"] #graphInner .edgePath path {
      stroke: #3b9eff !important; stroke-width: 1.5px !important;
    }
    html[data-theme="dark"] #graphInner marker path,
    html[data-theme="dark"] #graphInner .arrowheadPath { fill: #3b9eff !important; stroke: none !important; }
    html[data-theme="dark"] #graphInner .edgeLabel .label,
    html[data-theme="dark"] #graphInner .edgeLabel foreignObject div { background: transparent !important; color: #4a6a86 !important; }
    html[data-theme="dark"] #graphInner .cluster rect { fill: #060f1a !important; stroke: #1a3050 !important; }
    html[data-theme="dark"] #graphInner .cluster text,
    html[data-theme="dark"] #graphInner .cluster .label text { fill: #4a6a86 !important; }
    html[data-theme="dark"] #graphInner .label { color: #c2d6ee !important; }

    /* light */
    html[data-theme="light"] #graphInner .node rect,
    html[data-theme="light"] #graphInner .node circle,
    html[data-theme="light"] #graphInner .node ellipse,
    html[data-theme="light"] #graphInner .node polygon {
      fill: #eef4ff !important; stroke: #a4bcd8 !important; stroke-width: 1.5px !important;
    }
    html[data-theme="light"] #graphInner .node text,
    html[data-theme="light"] #graphInner .nodeLabel,
    html[data-theme="light"] #graphInner foreignObject div,
    html[data-theme="light"] #graphInner foreignObject span {
      fill: #0d1e38 !important; color: #0d1e38 !important;
    }
    html[data-theme="light"] #graphInner .flowchart-link,
    html[data-theme="light"] #graphInner .path,
    html[data-theme="light"] #graphInner .edgePath path {
      stroke: #1760c0 !important; stroke-width: 1.5px !important;
    }
    html[data-theme="light"] #graphInner marker path,
    html[data-theme="light"] #graphInner .arrowheadPath { fill: #1760c0 !important; stroke: none !important; }
    html[data-theme="light"] #graphInner .edgeLabel .label,
    html[data-theme="light"] #graphInner .edgeLabel foreignObject div { background: transparent !important; color: #5a7a9c !important; }
    html[data-theme="light"] #graphInner .cluster rect { fill: #e8f0fb !important; stroke: #a4bcd8 !important; }
    html[data-theme="light"] #graphInner .cluster text,
    html[data-theme="light"] #graphInner .cluster .label text { fill: #5a7a9c !important; }
    html[data-theme="light"] #graphInner .label { color: #0d1e38 !important; }

    /* ── Raw metrics ──────────────────────────────── */
    .raw-toggle-row {
      display: flex; align-items: center; gap: 8px;
      padding: 11px 16px; border-top: 1px solid var(--border);
      font-size: 12.5px; color: var(--sub); cursor: pointer;
    }
    .raw-toggle-row:hover { color: var(--text); }
    .raw-toggle-row input { cursor: pointer; accent-color: var(--blue); }
    .raw-pre {
      margin: 0; padding: 16px; border-top: 1px solid var(--border);
      background: var(--panel-alt); color: #6fa0c4;
      font-family: ui-monospace, monospace; font-size: 11.5px;
      line-height: 1.6; overflow-x: auto; max-height: 380px; overflow-y: auto;
    }

    /* ── Misc ─────────────────────────────────────── */
    .long-text {
      white-space: pre-wrap; font-family: ui-monospace, monospace;
      font-size: 12px; line-height: 1.55; color: var(--text);
    }
    ul.clean { margin: 0; padding-left: 16px; }
    ul.clean li { margin-bottom: 3px; }
    a { color: var(--blue); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .empty-row td { text-align: center; color: var(--sub); padding: 24px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useEffect, useMemo, useState, useRef } = React;

    // ── Helpers ────────────────────────────────────────────────────────────────

    function fmtNum(v, d = 2) {
      if (v === null || v === undefined || Number.isNaN(v)) return "-";
      if (typeof v !== "number") return String(v);
      return v.toLocaleString(undefined, { maximumFractionDigits: d });
    }

    function fmtBytes(b) {
      if (!b) return "";
      if (b < 1024) return `${b} B`;
      if (b < 1048576) return `${(b / 1024).toFixed(1)} KB`;
      return `${(b / 1048576).toFixed(1)} MB`;
    }

    function fileExt(name) {
      return (name?.split(".").pop() || "").toUpperCase();
    }

    function classifStyle(c = "") {
      const v = c.toLowerCase();
      if (v.includes("statement") || v.includes("work")) return "c-sow";
      if (v.includes("invoice")) return "c-invoice";
      if (v.includes("support") || v.includes("ticket")) return "c-support";
      if (v.includes("vendor") || v.includes("contract")) return "c-vendor";
      return "c-unknown";
    }

    function parsePrometheus(text) {
      return text.split("\n").map(l => l.trim())
        .filter(l => l && !l.startsWith("#"))
        .map(l => {
          const m = l.match(/^([a-zA-Z_:][a-zA-Z0-9_:]*)(\{[^}]*\})?\s+([-+]?\d*\.?\d+(?:[eE][-+]?\d+)?)$/);
          if (!m) return null;
          const [, name, raw = "", rawVal] = m;
          const labels = {};
          let lm;
          const re = /(\w+)="([^"]*)"/g;
          while ((lm = re.exec(raw)) !== null) labels[lm[1]] = lm[2];
          return { name, labels, value: Number(rawVal) };
        }).filter(Boolean);
    }

    function findM(metrics, name, filter = {}) {
      return metrics.find(m => m.name === name &&
        Object.entries(filter).every(([k, v]) => m.labels[k] === v));
    }

    function agentNames(metrics) {
      const s = new Set();
      metrics.forEach(m => { if (m.labels.agent_name) s.add(m.labels.agent_name); });
      return [...s].sort();
    }

    // ── renderStructuredValue ──────────────────────────────────────────────────

    function renderStructuredValue(value) {
      if (Array.isArray(value)) {
        if (!value.length) return <span style={{color:"var(--sub)"}}>—</span>;
        return (
          <ul className="clean">
            {value.map((item, i) => <li key={i}>{renderStructuredValue(item)}</li>)}
          </ul>
        );
      }
      if (value && typeof value === "object") {
        const entries = Object.entries(value);
        if (!entries.length) return <span style={{color:"var(--sub)"}}>—</span>;
        return (
          <table className="kv-table">
            <tbody>
              {entries.map(([k, v]) => (
                <tr key={k}>
                  <th>{k.replaceAll("_", " ")}</th>
                  <td>{renderStructuredValue(v)}</td>
                </tr>
              ))}
            </tbody>
          </table>
        );
      }
      if (typeof value === "string") {
        if (/^https?:\/\//i.test(value))
          return <a href={value} target="_blank" rel="noreferrer">{value}</a>;
        if (value.length > 120)
          return <div className="long-text">{value}</div>;
      }
      return <span>{String(value ?? "—")}</span>;
    }

    // ── Icons ──────────────────────────────────────────────────────────────────

    const IconUpload = () => (
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#3b9eff" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round">
        <path d="M10 13V4m0 0L7 7m3-3l3 3"/><path d="M4 14v1a2 2 0 002 2h8a2 2 0 002-2v-1"/>
      </svg>
    );

    const IconFile = () => (
      <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round">
        <path d="M12 2H6a2 2 0 00-2 2v12a2 2 0 002 2h8a2 2 0 002-2V8l-4-6z"/><path d="M12 2v6h6"/>
      </svg>
    );

    const IconBrand = () => (
      <svg viewBox="0 0 16 16" fill="none" stroke="#fff" strokeWidth="1.8" strokeLinecap="round">
        <path d="M3 8h10M8 3v10M4 4l8 8M12 4l-8 8"/>
      </svg>
    );

    const IconSun = () => (
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <circle cx="12" cy="12" r="5"/>
        <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
        <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
      </svg>
    );

    const IconMoon = () => (
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
    );

    // ── App ────────────────────────────────────────────────────────────────────

    function App() {
      const [activeTab,      setActiveTab]      = useState("processor");
      const [file,           setFile]           = useState(null);
      const [dragging,       setDragging]       = useState(false);
      const [loading,        setLoading]        = useState(false);
      const [result,         setResult]         = useState(null);
      const [error,          setError]          = useState("");
      const [metricsText,    setMetricsText]    = useState("");
      const [metricsError,   setMetricsError]   = useState("");
      const [showRaw,        setShowRaw]        = useState(false);
      const [graphMermaid,   setGraphMermaid]   = useState("");
      const [graphError,     setGraphError]     = useState("");
      const [theme,          setTheme]          = useState(() => localStorage.getItem("idp-theme") || "dark");
      const fileRef = useRef(null);

      useEffect(() => {
        document.documentElement.setAttribute("data-theme", theme);
        localStorage.setItem("idp-theme", theme);
      }, [theme]);

      useEffect(() => {
        fetch("/pipeline_graph")
          .then(r => r.ok ? r.json() : Promise.reject("Unable to load graph"))
          .then(d => setGraphMermaid(d.mermaid || ""))
          .catch(e => setGraphError(String(e)));
      }, []);

      useEffect(() => {
        if (!graphMermaid) return;
        const dark = theme === "dark";
        mermaid.initialize({
          startOnLoad: false,
          theme: dark ? "base" : "base",
          themeVariables: dark ? {
            darkMode: true,
            background: "#060d18", primaryColor: "#0c1824",
            primaryTextColor: "#c2d6ee", primaryBorderColor: "#1e3a58",
            lineColor: "#3b9eff", secondaryColor: "#091522", tertiaryColor: "#060d18",
            mainBkg: "#0c1824", nodeBorder: "#1e3a58", clusterBkg: "#060f1a",
            clusterBorder: "#1a3050", titleColor: "#c2d6ee",
            edgeLabelBackground: "#060d18", nodeTextColor: "#c2d6ee",
            textColor: "#c2d6ee", labelBackground: "#060d18",
            defaultLinkColor: "#3b9eff",
            fontFamily: "'Inter', ui-sans-serif, system-ui, sans-serif", fontSize: "13px",
          } : {
            darkMode: false,
            background: "#f0f5fb", primaryColor: "#eef4ff",
            primaryTextColor: "#0d1e38", primaryBorderColor: "#a4bcd8",
            lineColor: "#1760c0", secondaryColor: "#e8f0fb", tertiaryColor: "#f0f5fb",
            mainBkg: "#eef4ff", nodeBorder: "#a4bcd8", clusterBkg: "#e8f0fb",
            clusterBorder: "#a4bcd8", titleColor: "#0d1e38",
            edgeLabelBackground: "#f0f5fb", nodeTextColor: "#0d1e38",
            textColor: "#0d1e38", labelBackground: "#f0f5fb",
            defaultLinkColor: "#1760c0",
            fontFamily: "'Inter', ui-sans-serif, system-ui, sans-serif", fontSize: "13px",
          }
        });
        const id = `g_${Date.now()}`;
        mermaid.render(id, graphMermaid)
          .then(({ svg }) => {
            const el = document.getElementById("graphInner");
            if (el) el.innerHTML = svg;
          })
          .catch(e => setGraphError(String(e)));
      }, [graphMermaid, theme]);

      async function loadMetrics() {
        setMetricsError("");
        try {
          const r = await fetch("/metrics");
          const t = await r.text();
          if (!r.ok) throw new Error(t || "Failed");
          setMetricsText(t);
        } catch (e) {
          setMetricsError(e.message || "Failed to load metrics");
          setMetricsText("");
        }
      }

      useEffect(() => { loadMetrics(); }, []);

      function resetFile() {
        setFile(null); setResult(null); setError("");
        if (fileRef.current) fileRef.current.value = "";
      }

      function handleDrop(e) {
        e.preventDefault(); setDragging(false);
        const f = e.dataTransfer.files?.[0];
        if (f) { setFile(f); setResult(null); setError(""); }
      }

      async function submit() {
        if (!file) return;
        setLoading(true); setError(""); setResult(null);
        try {
          const fd = new FormData();
          fd.append("file", file);
          const r = await fetch("/process_document", { method: "POST", body: fd });
          const data = await r.json();
          if (!r.ok) throw new Error(data?.detail || "Processing failed");
          setResult(data);
          await loadMetrics();
        } catch (e) {
          setError(e.message || "Processing failed");
        } finally {
          setLoading(false);
        }
      }

      const parsedMetrics = useMemo(() => parsePrometheus(metricsText), [metricsText]);

      const metricsSummary = useMemo(() => {
        const reqTotal    = findM(parsedMetrics, "ententia_idp_requests_total")?.value ?? 0;
        const latSum      = findM(parsedMetrics, "ententia_idp_request_latency_seconds_sum")?.value ?? 0;
        const latCount    = findM(parsedMetrics, "ententia_idp_request_latency_seconds_count")?.value ?? 0;
        const totalErrors = parsedMetrics
          .filter(m => m.name === "ententia_idp_agent_errors_total")
          .reduce((s, m) => s + (m.value || 0), 0);
        const names = agentNames(parsedMetrics);
        const rows = names.map(n => {
          const ls  = findM(parsedMetrics, "ententia_idp_agent_latency_seconds_sum",   { agent_name: n })?.value ?? 0;
          const lc  = findM(parsedMetrics, "ententia_idp_agent_latency_seconds_count", { agent_name: n })?.value ?? 0;
          const iT  = findM(parsedMetrics, "ententia_idp_agent_tokens_total",  { agent_name: n, direction: "input" })?.value ?? 0;
          const oT  = findM(parsedMetrics, "ententia_idp_agent_tokens_total",  { agent_name: n, direction: "output" })?.value ?? 0;
          const err = findM(parsedMetrics, "ententia_idp_agent_errors_total",  { agent_name: n })?.value ?? 0;
          return { name: n, avgLat: lc > 0 ? ls / lc : 0, iT, oT, err };
        });
        return { reqTotal, avgLat: latCount > 0 ? latSum / latCount : 0, totalErrors, agentCount: rows.length, rows };
      }, [parsedMetrics]);

      const output      = result?.output;
      const agentMets   = result?.metrics?.agent_metrics || [];

      return (
        <div className="main">
          {/* ── Topbar ── */}
          <header className="topbar">
            <div className="brand">
              <div className="brand-logo"><IconBrand /></div>
              <span className="brand-name">ententia</span>
              <span className="brand-tag">IDP</span>
            </div>
            <nav className="nav-tabs">
              <button className={`nav-tab ${activeTab === "processor" ? "active" : ""}`} onClick={() => setActiveTab("processor")}>Processor</button>
              <button className={`nav-tab ${activeTab === "metrics"   ? "active" : ""}`} onClick={() => setActiveTab("metrics")}>Metrics</button>
            </nav>
            <div className="health-badge">
              <span className="health-dot"></span>API
            </div>
            <button
              className="theme-toggle"
              onClick={() => setTheme(t => t === "dark" ? "light" : "dark")}
              title={theme === "dark" ? "Switch to light mode" : "Switch to dark mode"}
            >
              {theme === "dark" ? <IconSun /> : <IconMoon />}
            </button>
          </header>

          <div className="container">
            {/* ──────────────── Processor tab ──────────────── */}
            {activeTab === "processor" && (
              <>
                {/* Upload card */}
                <div className="upload-card">
                  <div className="card-title">Process document</div>

                  <div
                    className={`upload-zone ${file ? "has-file" : ""} ${dragging ? "dragging" : ""}`}
                    onClick={() => !file && fileRef.current?.click()}
                    onDragOver={e => { e.preventDefault(); setDragging(true); }}
                    onDragLeave={() => setDragging(false)}
                    onDrop={handleDrop}
                  >
                    {file ? (
                      <>
                        <div className="upload-icon"><IconFile /></div>
                        <div style={{display:"flex",alignItems:"center",gap:"8px"}}>
                          <span className="file-ext">{fileExt(file.name)}</span>
                          <span className="file-name">{file.name}</span>
                        </div>
                        <span className="file-size">{fmtBytes(file.size)}</span>
                      </>
                    ) : (
                      <>
                        <div className="upload-icon"><IconUpload /></div>
                        <span className="upload-title">Drop a file or click to browse</span>
                        <span className="upload-sub">PDF · DOCX · PPTX · TXT</span>
                      </>
                    )}
                  </div>
                  <input ref={fileRef} type="file" className="hidden-input"
                    onChange={e => { const f = e.target.files?.[0]; if (f) { setFile(f); setResult(null); setError(""); } }} />

                  <div className="btn-row">
                    <button className="btn btn-primary" disabled={!file || loading} onClick={submit}>
                      {loading ? <><span className="spinner"></span>Processing…</> : "Upload & Process"}
                    </button>
                    {file && (
                      <button className="btn btn-ghost" onClick={resetFile}>Clear</button>
                    )}
                  </div>

                  {error && <div className="alert alert-error"><span>⚠</span><span>{error}</span></div>}
                </div>

                {/* Result */}
                {result && (
                  <>
                    {/* Overview stats */}
                    <div className="stats-grid">
                      <div className="stat-card c-blue">
                        <div className="stat-label">Classification</div>
                        <div className="stat-value" style={{fontSize:"14px",marginTop:"2px"}}>
                          <span className={`classif-pill ${classifStyle(output?.classification)}`}>
                            {output?.classification || "—"}
                          </span>
                        </div>
                      </div>
                      <div className="stat-card c-teal">
                        <div className="stat-label">Latency</div>
                        <div className="stat-value">{fmtNum(result.metrics?.request_latency_seconds, 3)}<span style={{fontSize:"12px",fontWeight:500,color:"var(--sub)",marginLeft:"3px"}}>s</span></div>
                      </div>
                      <div className="stat-card c-amber">
                        <div className="stat-label">Token cost</div>
                        <div className="stat-value">${fmtNum(result.metrics?.total_token_cost_usd ?? 0, 6)}</div>
                      </div>
                      <div className="stat-card c-violet">
                        <div className="stat-label">Document ID</div>
                        <div className="stat-value mono">{result.document_id || "—"}</div>
                      </div>
                    </div>

                    {result.partial && (
                      <div className="alert alert-warn" style={{marginBottom:"14px"}}>
                        <span>⚠</span><span>Partial response — one or more agents encountered errors.</span>
                      </div>
                    )}
                    {!!result.errors?.length && result.errors.map((e, i) => (
                      <div className="alert alert-error" style={{marginBottom:"10px"}} key={i}><span>✕</span><span>{e}</span></div>
                    ))}

                    {/* Summary */}
                    {output?.summary && (
                      <div className="result-block">
                        <div className="result-block-header">Summary</div>
                        <div className="result-block-body">
                          <p className="summary-text">{output.summary}</p>
                        </div>
                      </div>
                    )}

                    {/* Tags */}
                    {!!output?.tags?.length && (
                      <div className="result-block">
                        <div className="result-block-header">Tags</div>
                        <div className="result-block-body">
                          <div className="tags-wrap">
                            {output.tags.map(t => <span className="tag-pill" key={t}>{t}</span>)}
                          </div>
                        </div>
                      </div>
                    )}

                    {/* Extracted fields */}
                    {output?.extracted_fields && Object.keys(output.extracted_fields).length > 0 && (
                      <div className="result-block">
                        <div className="result-block-header">Extracted fields</div>
                        <div className="result-block-body">
                          {renderStructuredValue(output.extracted_fields)}
                        </div>
                      </div>
                    )}

                    {/* Per-agent execution */}
                    <div className="result-block">
                      <div className="result-block-header">Per-agent execution</div>
                      <div className="result-block-body" style={{padding:0}}>
                        <div className="table-wrap" style={{border:"none",borderRadius:0}}>
                          <table className="data-table">
                            <thead>
                              <tr>
                                <th>Agent</th>
                                <th>Latency (s)</th>
                                <th>Input tokens</th>
                                <th>Output tokens</th>
                                <th>Cost (USD)</th>
                                <th>Status</th>
                              </tr>
                            </thead>
                            <tbody>
                              {agentMets.length ? agentMets.map((m, i) => (
                                <tr key={`${m.agent_name}-${i}`}>
                                  <td style={{fontWeight:600}}>{m.agent_name}</td>
                                  <td className="num">{fmtNum(m.latency_seconds, 4)}</td>
                                  <td className="num">{fmtNum(m.input_tokens, 0)}</td>
                                  <td className="num">{fmtNum(m.output_tokens, 0)}</td>
                                  <td className="num">${fmtNum(m.cost_usd, 6)}</td>
                                  <td>
                                    <span className={`status-dot ${m.error ? "dot-err" : "dot-ok"}`}></span>
                                    <span style={{fontSize:"12px",color:m.error?"var(--red)":"var(--teal)"}}>
                                      {m.error ? "error" : "ok"}
                                    </span>
                                  </td>
                                </tr>
                              )) : (
                                <tr><td colSpan={6} className="empty-row" style={{textAlign:"center",color:"var(--sub)",padding:"24px"}}>No agent metrics available.</td></tr>
                              )}
                            </tbody>
                          </table>
                        </div>
                      </div>
                    </div>
                  </>
                )}

                {/* Pipeline graph */}
                <div className="graph-card">
                  <div className="graph-card-header">
                    <span>Pipeline graph</span>
                    <a href="/pipeline_graph.png" target="_blank" rel="noreferrer"
                       style={{fontSize:"11px",color:"var(--sub)",textDecoration:"none"}}>
                      Open PNG →
                    </a>
                  </div>
                  <div className="graph-card-body">
                    {graphError
                      ? <p style={{color:"var(--red)",fontSize:"13px"}}>{graphError}</p>
                      : <div id="graphInner"></div>
                    }
                  </div>
                </div>
              </>
            )}

            {/* ──────────────── Metrics tab ──────────────── */}
            {activeTab === "metrics" && (
              <>
                <div className="stats-grid" style={{marginBottom:"20px"}}>
                  <div className="stat-card c-blue">
                    <div className="stat-label">Total requests</div>
                    <div className="stat-value">{fmtNum(metricsSummary.reqTotal, 0)}</div>
                  </div>
                  <div className="stat-card c-teal">
                    <div className="stat-label">Avg request latency</div>
                    <div className="stat-value">{fmtNum(metricsSummary.avgLat, 3)}<span style={{fontSize:"12px",fontWeight:500,color:"var(--sub)",marginLeft:"3px"}}>s</span></div>
                  </div>
                  <div className="stat-card c-violet">
                    <div className="stat-label">Agents observed</div>
                    <div className="stat-value">{fmtNum(metricsSummary.agentCount, 0)}</div>
                  </div>
                  <div className="stat-card c-red">
                    <div className="stat-label">Total agent errors</div>
                    <div className="stat-value">{fmtNum(metricsSummary.totalErrors, 0)}</div>
                  </div>
                </div>

                {metricsError && (
                  <div className="alert alert-error" style={{marginBottom:"16px"}}>
                    <span>⚠</span><span>{metricsError}</span>
                  </div>
                )}

                <div className="result-block">
                  <div className="result-block-header">
                    Per-agent runtime metrics
                    <button className="btn btn-ghost" style={{marginLeft:"auto",padding:"4px 12px",fontSize:"12px"}} onClick={loadMetrics}>
                      Refresh
                    </button>
                  </div>
                  <div className="table-wrap" style={{border:"none",borderRadius:0}}>
                    <table className="data-table">
                      <thead>
                        <tr>
                          <th>Agent</th>
                          <th>Avg latency (s)</th>
                          <th>Input tokens</th>
                          <th>Output tokens</th>
                          <th>Errors</th>
                        </tr>
                      </thead>
                      <tbody>
                        {metricsSummary.rows.length ? metricsSummary.rows.map(r => (
                          <tr key={r.name}>
                            <td style={{fontWeight:600}}>{r.name}</td>
                            <td className="num">{fmtNum(r.avgLat, 3)}</td>
                            <td className="num">{fmtNum(r.iT, 0)}</td>
                            <td className="num">{fmtNum(r.oT, 0)}</td>
                            <td className="num" style={{color: r.err > 0 ? "var(--red)" : "var(--teal)"}}>
                              {fmtNum(r.err, 0)}
                            </td>
                          </tr>
                        )) : (
                          <tr><td colSpan={5} style={{textAlign:"center",color:"var(--sub)",padding:"24px"}}>No agent metrics recorded yet.</td></tr>
                        )}
                      </tbody>
                    </table>
                  </div>
                  <label className="raw-toggle-row">
                    <input type="checkbox" checked={showRaw} onChange={e => setShowRaw(e.target.checked)} />
                    Show raw Prometheus output
                  </label>
                  {showRaw && <pre className="raw-pre">{metricsText || "No metrics loaded."}</pre>}
                </div>
              </>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
